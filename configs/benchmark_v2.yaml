# Prepared v2 configuration. NOT the published run.
# Goal: close the three known methodology gaps without touching results/.
#   - mmlu_examples: 200  -> smaller quality intervals
#   - repeats: 3          -> performance error bars
#   - vllm_awq            -> FP16 vs AWQ inside the same vLLM engine
results_dir: results_v2

benchmark:
  prompts_per_level: 32        # requests per concurrency level
  concurrency_levels: [1, 4, 8, 16]
  repeats: 3                   # error bars for mean throughput / p95
  warmup_requests: 4
  input_tokens: 128
  max_new_tokens: 128
  temperature: 0.0
  top_p: 1.0
  seed: 42
  timeout_s: 600
  results_dir: results_v2

quality:
  perplexity_chars: 6000
  perplexity_window: 1024
  mmlu_subjects:
    - abstract_algebra
    - anatomy
    - college_computer_science
    - high_school_mathematics
    - miscellaneous
  mmlu_examples: 200           # 5x the published subset
  seed: 42
  max_acceptable_quality_loss_pp: 2.0

backends:
  hf:
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    dtype: float16
    max_model_len: 2048
    device_map: auto

  vllm:
    model_id: Qwen/Qwen2.5-1.5B-Instruct
    dtype: float16
    max_model_len: 2048
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1

  vllm_awq:
    model_id: Qwen/Qwen2.5-1.5B-Instruct-AWQ
    dtype: float16
    quantization: awq           # passed to vLLM AsyncEngineArgs
    max_model_len: 2048
    gpu_memory_utilization: 0.85
    tensor_parallel_size: 1

  llamacpp:
    model_id: bartowski/Qwen2.5-1.5B-Instruct-GGUF
    gguf_file: Qwen2.5-1.5B-Instruct-Q4_K_M.gguf
    n_ctx: 2048
    n_gpu_layers: -1
    n_batch: 512
    chat_format: null

  awq:
    model_id: Qwen/Qwen2.5-1.5B-Instruct-AWQ
    dtype: float16
    max_model_len: 2048
    device_map: auto
    fuse_layers: true
