<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Animated benchmark pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f81f7"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <path id="route" d="M 165 130 H 1035"/>
  </defs>

  <style>
    .title { fill: #e6edf3; font: 700 22px system-ui, -apple-system, Segoe UI, sans-serif; }
    .label { fill: #e6edf3; font: 600 17px system-ui, -apple-system, Segoe UI, sans-serif; }
    .sub { fill: #8b949e; font: 13px system-ui, -apple-system, Segoe UI, sans-serif; }
    .node { fill: #0d1117; stroke: #30363d; stroke-width: 2; }
    .track { stroke: #30363d; stroke-width: 6; fill: none; stroke-linecap: round; }
    .dot { fill: #58a6ff; filter: url(#glow); }
    .accent { stroke: url(#accent); }
  </style>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <text class="title" x="32" y="42">Same model. Same prompts. Same metrics. Different serving strategy.</text>

  <path class="track" d="M 165 130 H 1035"/>
  <path d="M 165 130 H 1035" stroke="url(#accent)" stroke-width="2" fill="none" stroke-dasharray="8 10" opacity="0.65"/>

  <g>
    <rect class="node accent" x="32" y="88" width="132" height="84" rx="14"/>
    <text class="label" x="98" y="120" text-anchor="middle">Workload</text>
    <text class="sub" x="98" y="145" text-anchor="middle">128 in / 128 out</text>
  </g>

  <g>
    <rect class="node" x="228" y="76" width="170" height="108" rx="14"/>
    <text class="label" x="313" y="108" text-anchor="middle">Backends</text>
    <text class="sub" x="313" y="132" text-anchor="middle">hf · vllm · awq</text>
    <text class="sub" x="313" y="154" text-anchor="middle">llamacpp</text>
  </g>

  <g>
    <rect class="node" x="462" y="88" width="150" height="84" rx="14"/>
    <text class="label" x="537" y="120" text-anchor="middle">Concurrency</text>
    <text class="sub" x="537" y="145" text-anchor="middle">1 · 4 · 8 · 16</text>
  </g>

  <g>
    <rect class="node" x="676" y="88" width="170" height="84" rx="14"/>
    <text class="label" x="761" y="120" text-anchor="middle">Measure</text>
    <text class="sub" x="761" y="145" text-anchor="middle">latency · tok/s · VRAM</text>
  </g>

  <g>
    <rect class="node" x="910" y="88" width="178" height="84" rx="14"/>
    <text class="label" x="999" y="120" text-anchor="middle">Quality gate</text>
    <text class="sub" x="999" y="145" text-anchor="middle">MMLU · WikiText PPL</text>
  </g>

  <circle class="dot" r="7">
    <animateMotion dur="4.2s" repeatCount="indefinite">
      <mpath xlink:href="#route"/>
    </animateMotion>
  </circle>
  <circle class="dot" r="5" opacity="0.7">
    <animateMotion dur="4.2s" begin="1.4s" repeatCount="indefinite">
      <mpath xlink:href="#route"/>
    </animateMotion>
  </circle>
  <circle class="dot" r="5" opacity="0.45">
    <animateMotion dur="4.2s" begin="2.8s" repeatCount="indefinite">
      <mpath xlink:href="#route"/>
    </animateMotion>
  </circle>

  <text class="sub" x="600" y="228" text-anchor="middle">Animated flow: requests move left → right through the harness. This SVG loops forever.</text>
</svg>
